<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!--
    Cito Gaston's spray chart field map.
    Rules for replacements: keep viewBox="0 0 1000 1000" and home plate at (500, 950).
    Optional zone paths (ids zone-*) are used only to label marks; they are invisible.
  -->
  <rect x="0" y="0" width="1000" height="1000" fill="#ffffff"/>

  <!-- Fair territory grass -->
  <path d="M500,950 L47,497 A454,454 0 0 1 953,497 Z" fill="#eef3ea"/>

  <!-- Infield dirt and home circle (drawn ~1.6x scale so ground balls have room) -->
  <path d="M500,950 L265.4,715.4 A240,240 0 0 1 734.6,715.4 Z" fill="#f3ebdc"/>
  <circle cx="500" cy="950" r="45" fill="#f3ebdc"/>

  <!-- Fence and foul lines -->
  <g fill="none" stroke="#000" stroke-width="2" vector-effect="non-scaling-stroke">
    <path d="M47,497 A454,454 0 0 1 953,497" vector-effect="non-scaling-stroke"/>
    <path d="M500,950 L47,497 M500,950 L953,497" vector-effect="non-scaling-stroke"/>
    <path d="M265.4,715.4 A240,240 0 0 1 734.6,715.4" vector-effect="non-scaling-stroke"/>
    <path d="M668,782 L500,614 L332,782" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Bases, plate, rubber -->
  <g fill="#fff" stroke="#000" stroke-width="2" vector-effect="non-scaling-stroke">
    <rect x="657" y="771" width="22" height="22" transform="rotate(45 668 782)" vector-effect="non-scaling-stroke"/>
    <rect x="489" y="603" width="22" height="22" transform="rotate(45 500 614)" vector-effect="non-scaling-stroke"/>
    <rect x="321" y="771" width="22" height="22" transform="rotate(45 332 782)" vector-effect="non-scaling-stroke"/>
    <path d="M490,942 L510,942 L510,952 L500,960 L490,952 Z" vector-effect="non-scaling-stroke"/>
    <rect x="488" y="764" width="24" height="6" vector-effect="non-scaling-stroke"/>
  </g>


  <!-- Optional named zones (invisible; used only to label marks) -->
  <g fill="none" stroke="none">
    <path id="zone-foul-left" d="M500,950 L0,450 L0,1000 L500,1000 Z"/>
    <path id="zone-foul-right" d="M500,950 L1000,450 L1000,1000 L500,1000 Z"/>
    <path id="zone-over-fence" d="M47,497 A454,454 0 0 1 953,497 L1000,450 L1000,0 L0,0 L0,450 Z"/>
    <path id="zone-left" d="M500,950 L47,497 A454,454 0 0 1 279.5,126.9 Z"/>
    <path id="zone-center" d="M500,950 L279.5,126.9 A454,454 0 0 1 720.5,126.9 Z"/>
    <path id="zone-right" d="M500,950 L720.5,126.9 A454,454 0 0 1 953,497 Z"/>
  </g>
</svg>
